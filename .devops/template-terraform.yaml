# Plan / apply pipeline for a Terraform (OpenTofu) project.
#
# With no "environments" the project is planned and applied once, exactly as
# before. With several environments (for example test and production), the
# stages are repeated per environment, each with its own state file (backend
# key), arguments and approval policy, chained with "after".
#
# Example:
#   environments:
#     - name: test
#       backendKey: identity/test/terraform.tfstate
#       planArguments: "-var-file environments/test.tfvars"
#     - name: production
#       after: test
#       backendKey: identity/production/terraform.tfstate
#       planArguments: "-var-file environments/production.tfvars"
#       requireApproval: true
#
# Environment names become part of stage names, so use letters, digits and
# underscores only.
parameters:
  - name: tofuDirectory
    type: string
  - name: planArguments
    type: string
    default: ""
  - name: addVaultAuthentication
    type: boolean
    default: false
  - name: addGithubToken
    type: boolean
    default: false
  - name: artifactName
    type: string
    default: "terraform-plan"
  - name: includeAzureDevopsVariables
    type: boolean
    default: false
  # List of { variableGroupName: string, outputPrefix: string } - see
  # template-sync-outputs.yaml
  - name: syncTargets
    type: object
    default: []
  # List of { repository, namespace, type, version } - see
  # template-install-local-providers.yaml
  - name: localProviders
    type: object
    default: []
  # Resource types whose replacement (delete + create) does not require manual
  # approval, for example secrets rotated by time_rotating.
  - name: rotationResourceTypes
    type: object
    default: []
  # List of environments. Each entry may set:
  #   name:            environment name ("" for the single, unnamed default)
  #   backendKey:      state file key passed to "tofu init -backend-config"
  #   planArguments:   extra "tofu plan" arguments for this environment
  #   after:           name of the environment that must be applied first
  #   requireApproval: always wait for manual approval before applying
  - name: environments
    type: object
    default:
      - name: ""

stages:
  - ${{ each env in parameters.environments }}:
    - template: template-terraform-stages.yaml
      parameters:
        tofuDirectory: ${{ parameters.tofuDirectory }}
        planArguments: ${{ format('{0} {1}', parameters.planArguments, coalesce(env.planArguments, '')) }}
        addVaultAuthentication: ${{ parameters.addVaultAuthentication }}
        addGithubToken: ${{ parameters.addGithubToken }}
        artifactName: ${{ parameters.artifactName }}
        includeAzureDevopsVariables: ${{ parameters.includeAzureDevopsVariables }}
        syncTargets: ${{ parameters.syncTargets }}
        localProviders: ${{ parameters.localProviders }}
        rotationResourceTypes: ${{ parameters.rotationResourceTypes }}
        requireApproval: ${{ coalesce(env.requireApproval, false) }}
        ${{ if ne(coalesce(env.name, ''), '') }}:
          stageSuffix: _${{ env.name }}
          displayNameSuffix: " (${{ env.name }})"
        ${{ if ne(coalesce(env.backendKey, ''), '') }}:
          initArguments: '-backend-config="key=${{ env.backendKey }}"'
        ${{ if ne(coalesce(env.after, ''), '') }}:
          previousStageSuffix: _${{ env.after }}
