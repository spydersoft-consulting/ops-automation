schedules:
  - cron: "0 0 * * *"
    displayName: Daily 2 AM build
    branches:
      include:
        - main
    always: true

trigger:
  branches:
    include:
      - main
      - feature/*
  paths:
    include:
      - terraform/azuread/*
      - .devops/pipeline-tf-azuread.yaml

pr:
  branches:
    include:
      - main
  paths:
    include:
      - terraform/azuread/*
      - .devops/pipeline-tf-azuread.yaml

variables:
  - group: "terraform-azuread"
  - group: "terraform-s3-backend"
  - group: "terraform-hcvault"
  - group: "terraform-azure-devops"

extends:
  template: template-terraform.yaml
  parameters:
    tofuDirectory: "terraform/azuread"
    addVaultAuthentication: true
    planArguments: "-var-file config/gerega.tfvars"
    # This state manages the SPs that authenticate both this pipeline
    # (terraform-azuread-sp, see sp-tf-azuread.tf) and terraform-geregalab
    # (terraform-gerega-lab, which still auto-rotates). Push current values
    # back into both variable groups right after apply so neither pipeline
    # can end up authenticating with a stale secret.
    syncTargets:
      - variableGroupName: "terraform-azuread"
        outputPrefix: ""
      - variableGroupName: "terraform-gerega-lab"
        outputPrefix: "GEREGALAB_"
